, "y": true}, "font": {"color": "#222222"}, "id": "tip_prep", "label": "tip_prep", "margin": 12, "shape": "box", "title": "Prepare vendor tips, tip_prep, Sat Sep 12", "x": -1282.5, "y": 0}, {"borderWidth": 1, "color": "#7FB3D5", "fixed": {"x": false, "y": false}, "font": {"color": "#222222"}, "id": "tent_pickup", "label": "tent_pickup", "shape": "box", "title": "ABC pickup, tent_pickup, Mon Sep 21", "x": -180.0, "y": 90}, {"borderWidth": 3, "color": "#E74C3C", "fixed": {"x": false, "y": false}, "font": {"color": "#222222"}, "id": "store", "label": "store", "shape": "box", "title": "Store items, store, (no fixed date)", "x": 0.0, "y": 180}, {"borderWidth": 1, "color": "#daab30", "fixed": {"x": true, "y": true}, "font": {"color": "#222222"}, "id": "gift_log", "label": "gift_log", "margin": 12, "shape": "box", "title": "Document gifts, gift_log, (no fixed date)", "x": 1282.5, "y": 0}, {"borderWidth": 3, "color": "#E74C3C", "fixed": {"x": true, "y": true}, "font": {"color": "#222222"}, "id": "nap_rewash", "label": "nap_rewash", "margin": 12, "shape": "box", "title": "Napkins washed and folded, nap_rewash, (no fixed date)", "x": 1147.5, "y": 0}, {"borderWidth": 1, "color": "#daab30", "fixed": {"x": true, "y": true}, "font": {"color": "#222222"}, "id": "attire_clean", "label": "attire_clean", "margin": 12, "shape": "box", "title": "Dress and suit to cleaner, attire_clean, (no fixed date)", "x": 877.5, "y": 0}, {"borderWidth": 1, "color": "#daab30", "fixed": {"x": true, "y": true}, "font": {"color": "#222222"}, "id": "chair_prep", "label": "chair_prep", "margin": 12, "shape": "box", "title": "Chairs collapsed and placed for pickup, chair_prep, (no fixed date)", "x": -67.5, "y": 0}, {"borderWidth": 1, "color": "#daab30", "fixed": {"x": true, "y": true}, "font": {"color": "#222222"}, "id": "branch_down", "label": "branch_down", "margin": 12, "shape": "box", "title": "Branches taken down, branch_down, Sun Sep 20", "x": -472.5, "y": 0}, {"borderWidth": 1, "color": "#daab30", "fixed": {"x": true, "y": true}, "font": {"color": "#222222"}, "id": "glass_clean", "label": "glass_clean", "margin": 12, "shape": "box", "title": "Glassware cleaned and boxed, glass_clean, (no fixed date)", "x": 1012.5, "y": 0}, {"borderWidth": 1, "color": "#7FB3D5", "fixed": {"x": false, "y": false}, "font": {"color": "#222222"}, "id": "bailis", "label": "bailis", "shape": "box", "title": "Change names, bailis, (no fixed date)", "x": 0.0, "y": 90}, {"borderWidth": 3, "color": "#E74C3C", "fixed": {"x": false, "y": false}, "font": {"color": "#222222"}, "id": "sell", "label": "sell", "shape": "box", "title": "Re-sell items, sell, (no fixed date)", "x": 90.0, "y": 90}, {"borderWidth": 1, "color": "#daab30", "fixed": {"x": true, "y": true}, "font": {"color": "#222222"}, "id": "extras_inside", "label": "extras_inside", "margin": 12, "shape": "box", "title": "Leftovers packed and stored, extras_inside, Sat Sep 19", "x": -1147.5, "y": 0}, {"borderWidth": 1, "color": "#daab30", "fixed": {"x": true, "y": true}, "font": {"color": "#222222"}, "id": "ap_clean", "label": "ap_clean", "margin": 12, "shape": "box", "title": "Clean up, ap_clean, (no fixed date)", "x": 337.5, "y": 0}]);
                  edges = new vis.DataSet([{"arrows": "to", "color": "#B2BABB", "from": "rental_prep", "to": "rental_pickup", "width": 1}, {"arrows": "to", "color": "#B2BABB", "from": "table_prep", "to": "tent_pickup", "width": 1}, {"arrows": "to", "color": "#B2BABB", "from": "certificate_return", "to": "bailis", "width": 1}, {"arrows": "to", "color": "#B2BABB", "from": "flower_down", "to": "sw_reset", "width": 1}, {"arrows": "to", "color": "#B2BABB", "from": "gift_log", "to": "notes", "width": 1}, {"arrows": "to", "color": "#E74C3C", "from": "nap_rewash", "to": "sell", "width": 3}, {"arrows": "to", "color": "#B2BABB", "from": "chair_prep", "to": "tent_pickup", "width": 1}, {"arrows": "to", "color": "#B2BABB", "from": "branch_down", "to": "sw_reset", "width": 1}, {"arrows": "to", "color": "#B2BABB", "from": "glass_clean", "to": "sell", "width": 1}, {"arrows": "to", "color": "#E74C3C", "from": "sell", "to": "store", "width": 3}, {"arrows": "to", "color": "#B2BABB", "from": "extras_inside", "to": "leftover_distribute", "width": 1}]);

                  nodeColors = {};
                  allNodes = nodes.get({ returnType: "Object" });
                  for (nodeId in allNodes) {
                    nodeColors[nodeId] = allNodes[nodeId].color;
                  }
                  allEdges = edges.get({ returnType: "Object" });
                  // adding nodes and edges to the graph
                  data = {nodes: nodes, edges: edges};

                  var options = {"layout": {"improvedLayout": false}, "interaction": {"hover": true, "navigationButtons": false, "keyboard": true, "zoomSpeed": 0.3}, "physics": {"enabled": true, "barnesHut": {"gravitationalConstant": -3000, "centralGravity": 0.05, "springLength": 150, "springConstant": 0.02, "damping": 0.3, "avoidOverlap": 0.2}, "stabilization": {"iterations": 150, "fit": true}}};

                  


                  

                  network = new vis.Network(container, data, options);
                  (function () {
                    const MIN_Y = 90;
                    const ORPHAN_Y = 0;
                    const orphanSet = new Set(["v_pay", "photo_share", "gift_log", "nap_rewash", "patio_reset", "table_prep", "rental_prep", "attire_clean", "power_reset", "v_review", "sun_clean", "certificate_return", "chair_prep", "branch_down", "glass_clean", "flower_down", "lights_down", "tip_prep", "extras_inside", "ap_clean"]);

                    window.fitGraph = function () {
                      network.fit({ animation: false, padding: 80 });
                    };

                    network.on("beforeDrawing", function () {
                      const bodyNodes = network.body.nodes;
                      for (const id in bodyNodes) {
                        const node = bodyNodes[id];
                        if (orphanSet.has(id)) {
                          continue;
                        }
                        if (node.y < MIN_Y) {
                          node.y = MIN_Y;
                        }
                      }
                    });

                    function pinOrphanY(nodeId) {
                      const pos = network.getPositions([nodeId])[nodeId];
                      if (pos && pos.y !== ORPHAN_Y) {
                        network.moveNode(nodeId, pos.x, ORPHAN_Y);
                      }
                    }

                    network.on("dragStart", function (params) {
                      params.nodes.forEach(function (id) {
                        if (orphanSet.has(id)) {
                          nodes.update({ id: id, fixed: { x: false, y: true } });
                        }
                      });
                    });

                    network.on("dragging", function (params) {
                      params.nodes.forEach(function (id) {
                        if (orphanSet.has(id)) pinOrphanY(id);
                      });
                    });

                    network.on("dragEnd", function (params) {
                      params.nodes.forEach(function (id) {
                        if (!orphanSet.has(id)) return;
                        const pos = network.getPositions([id])[id];
                        network.moveNode(id, pos.x, ORPHAN_Y);
                        nodes.update({ id: id, fixed: { x: true, y: true } });
                      });
                    });

                    network.once("stabilizationIterationsDone", function () {
                      // Orphans stay out of physics via per-node fixed; re-pin in case
                      // anything nudged them during stabilization.
                      orphanSet.forEach(function (id) {
                        pinOrphanY(id);
                        nodes.update({ id: id, fixed: { x: true, y: true } });
                      });
                      window.fitGraph();
                    });
                    setTimeout(window.fitGraph, 800);

                    const EDGE_INCOMING = "#000000";
                    const EDGE_OUTGOING = "#27AE60";
                    const edgeDefaults = new Map();
                    edges.forEach(function (edge) {
                      edgeDefaults.set(edge.id, {
                        color: edge.color,
                        width: edge.width,
                      });
                    });

                    let highlightedNode = null;

                    function clearEdgeHighlight() {
                      if (!highlightedNode) return;
                      const updates = [];
                      edgeDefaults.forEach(function (style, id) {
                        updates.push({ id: id, color: style.color, width: style.width });
                      });
                      edges.update(updates);
                      highlightedNode = null;
                    }

                    function highlightEdgesForNode(nodeId) {
                      clearEdgeHighlight();
                      highlightedNode = nodeId;
                      const updates = [];
                      edges.forEach(function (edge) {
                        const style = edgeDefaults.get(edge.id);
                        const baseWidth = style ? style.width : 1;
                        const highlightWidth = baseWidth * 2;
                        if (edge.to === nodeId) {
                          updates.push({
                            id: edge.id,
                            color: EDGE_INCOMING,
                            width: highlightWidth,
                          });
                        } else if (edge.from === nodeId) {
                          updates.push({
                            id: edge.id,
                            color: EDGE_OUTGOING,
                            width: highlightWidth,
                          });
                        }
                      });
                      if (updates.length) edges.update(updates);
                    }

                    network.on("click", function (params) {
                      if (params.nodes.length === 1) {
                        highlightEdgesForNode(params.nodes[0]);
                      } else {
                        clearEdgeHighlight();
                      }
                    });
                  })();


                  

                  

                  


                  

                  return network;

              }
              drawGraph();
